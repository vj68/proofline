[project]
name = "proofline"
version = "0.1.0"
description = "A grant-report integrity agent for small nonprofits, built with Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kermit" }]
dependencies = [
  "awscrt>=0.28.0",
  "boto3>=1.40.0",
  "fastapi>=0.116.0",
  "mangum>=0.19.0",
  "pydantic>=2.11.0",
  "strands-agents>=1.0.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]
